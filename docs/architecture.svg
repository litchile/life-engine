      <rect x="960" y="150" width="200" height="4" rx="2" fill="url(#accent)"/>
      <g stroke="#f59e0b" stroke-width="2" fill="none">
        <path d="M1044 178 h32 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-20 l-8 7 v-7 h-4 a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 4 -4 Z"/>
      </g>
      <text x="1060" y="232" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Proactive Feishu</text>
      <text x="1060" y="256" text-anchor="middle" font-size="13" fill="#94a3b8">飞书主动消息</text>
