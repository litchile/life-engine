      <g stroke="#5eead4" stroke-width="2" fill="none">
        <rect x="122" y="176" width="36" height="26" rx="4"/>
        <circle cx="132" cy="189" r="5"/>
        <line x1="144" y1="185" x2="152" y2="185"/>
        <line x1="144" y1="193" x2="152" y2="193"/>
      </g>
      <text x="140" y="232" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Character Pack</text>
      <text x="140" y="256" text-anchor="middle" font-size="13" fill="#94a3b8">角色设定</text>
    </g>

    <g>
      <rect x="270" y="150" width="200" height="130" rx="14" fill="#18243b" stroke="#2b3b57"/>
      <rect x="270" y="150" width="200" height="4" rx="2" fill="url(#accent)"/>
