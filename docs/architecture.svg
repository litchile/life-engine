<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="loop" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="470" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="24" fill="none" stroke="#1e293b"/>

  <text x="48" y="66" font-size="34" font-weight="700" fill="#f8fafc">Life Engine</text>
  <rect x="49" y="80" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="48" y="110" font-size="16" fill="#94a3b8">Keeps AI characters living while you're offline · 让 AI 角色在你离线时也继续生活</text>

  <g>
    <g>
