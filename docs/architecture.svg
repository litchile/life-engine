  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="244" y1="215" x2="264" y2="215"/>
    <line x1="474" y1="215" x2="494" y2="215"/>
    <line x1="704" y1="215" x2="724" y2="215"/>
    <line x1="934" y1="215" x2="954" y2="215"/>
