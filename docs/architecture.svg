  <path d="M1060 280 C1060 332, 370 332, 370 286" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#loop)"/>
  <rect x="548" y="350" width="334" height="22" rx="6" fill="#0b1220"/>
  <text x="715" y="365" text-anchor="middle" font-size="13" fill="#f2b968">runs on real-world time · 按现实时间持续，无需你在线</text>

  <rect x="40" y="400" width="1120" height="46" rx="12" fill="#0d1526" stroke="#24324a"/>
