  <text x="82" y="428" font-size="14" fill="#cbd5e1">Self-hosted · Tencent SCF + COS · Feishu adapter today</text>
  <text x="1144" y="428" text-anchor="end" font-size="14" fill="#7c8aa3">Discord / Telegram / Web — next</text>
